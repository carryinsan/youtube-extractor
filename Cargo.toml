[package]
name = "arix-youtube-transcript"
version = "1.0.0"
edition = "2024"
publish = false

[dependencies]
futures = "0.3"
http-body-util = "0.1"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "gzip", "brotli", "deflate", "http2"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
url = "2"
vercel_runtime = "2.4"

[[bin]]
name = "transcript"
path = "api/transcript.rs"
